# Local development stack — matches the "local" column in docs/deployment/environments.md.
# Services can add themselves here; infra containers below are the shared baseline.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app        # local-only credential; real envs use the secret manager
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # auto-create is acceptable ONLY locally; production topics are declared explicitly
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Example service wiring — duplicate per service:
  # orders-service:
  #   build:
  #     context: ../orders-service
  #     dockerfile: ../docker/Dockerfile
  #   ports: ["8080:8080"]
  #   environment:
  #     SPRING_PROFILES_ACTIVE: local
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/app
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #     SPRING_DATA_REDIS_HOST: redis
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     redis: { condition: service_healthy }

volumes:
  pgdata:
